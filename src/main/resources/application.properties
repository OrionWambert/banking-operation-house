spring.application.name=banking-operation-house
server.port=7070

# Docker Compose (dev only): start Postgres and ClickHouse if needed, leave them running on shutdown
# so the CDC pipeline keeps working
spring.docker.compose.lifecycle-management=start-only

# Schema is owned by Flyway; Hibernate only checks it matches the entities.
# baseline-on-migrate adopts a database created before Flyway was introduced.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Batched inserts for the seeder (needs the sequence id generator, not IDENTITY)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Demo data: tops the table up to app.seed.count at startup (override with --app.seed.count=5000000)
app.seed.enabled=true
app.seed.count=1000000
app.seed.chunk-size=1000
