name: banking-operation-house

# PeerDB (CDC Postgres -> ClickHouse) lives under the "cdc" profile, adapted from
# https://github.com/PeerDB-io/peerdb/blob/v0.37.17/docker-compose.yml
# Start it with: docker compose --profile cdc up -d

x-peerdb-staging: &peerdb-staging
  # S3-compatible staging bucket PeerDB uses to load ClickHouse
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: _peerdb_minioadmin
  MINIO_ROOT_USER: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: _peerdb_minioadmin
  MINIO_ROOT_PASSWORD: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://peerdb-minio:9000
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket

x-peerdb-catalog: &peerdb-catalog
  PEERDB_CATALOG_HOST: peerdb-catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-peerdb-temporal: &peerdb-temporal
  TEMPORAL_HOST_PORT: peerdb-temporal:7233
  TEMPORAL_CLIENT_CERT:
  TEMPORAL_CLIENT_KEY:
  PEERDB_TEMPORAL_NAMESPACE: default

services:
  postgres:
    image: 'postgres:18'
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    # Logical replication enabled for CDC
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banking -d banking']
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: 'clickhouse/clickhouse-server:26.10'
    restart: unless-stopped
    labels:
      # The app only writes to Postgres; ClickHouse is fed by CDC, so no Spring datasource for it
      org.springframework.boot.ignore: 'true'
    environment:
      CLICKHOUSE_DB: banking
      CLICKHOUSE_USER: banking
      CLICKHOUSE_PASSWORD: banking
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '${CLICKHOUSE_HTTP_PORT:-8124}:8123'   # HTTP
      - '${CLICKHOUSE_NATIVE_PORT:-9001}:9000'   # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- PeerDB (profile: cdc)

  peerdb-catalog:
    profiles: [cdc]
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    command: -c config_file=/etc/postgresql.conf
    restart: unless-stopped
    labels:
      # PeerDB's internal catalog, not a datasource for the app
      org.springframework.boot.ignore: 'true'
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - peerdb-catalog-data:/var/lib/postgresql
      - ./peerdb/volumes/postgresql.conf:/etc/postgresql.conf
      - ./peerdb/volumes/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', 'postgres', '-U', 'postgres']
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  peerdb-temporal:
    profiles: [cdc]
    image: temporalio/auto-setup:1.29@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    restart: unless-stopped
    depends_on:
      peerdb-catalog:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=peerdb-catalog
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./peerdb/volumes/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig

  peerdb-temporal-admin-tools:
    profiles: [cdc]
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1@sha256:da0c7a7982b571857173ab8f058e7f139b3054800abb4dcb100445d29a563ee8
    restart: unless-stopped
    depends_on:
      - peerdb-temporal
    environment:
      - TEMPORAL_ADDRESS=peerdb-temporal:7233
      - TEMPORAL_CLI_ADDRESS=peerdb-temporal:7233
      - TEMPORAL_CLI_SHOW_STACKS=1
    stdin_open: true
    tty: true
    # Run through sh so the script works even if git dropped its executable bit (e.g. committed from Windows)
    entrypoint: ['sh', '/etc/temporal/entrypoint.sh']
    healthcheck:
      # Healthy only once PeerDB's MirrorName search attribute exists, otherwise mirrors can't start
      test: ['CMD-SHELL', 'temporal operator search-attribute list | grep -qw MirrorName']
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - ./peerdb/scripts/mirror-name-search.sh:/etc/temporal/entrypoint.sh

  peerdb-temporal-ui:
    profiles: [cdc]
    image: temporalio/ui:2.58.0@sha256:d36185e811d0ce1720b8d3ca4d9ac4dac504b67181e9b5e3d3ca72b2294f3590
    restart: unless-stopped
    depends_on:
      - peerdb-temporal
    environment:
      - TEMPORAL_ADDRESS=peerdb-temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${PEERDB_UI_PORT:-3001}
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
    ports:
      - '${TEMPORAL_UI_PORT:-8085}:8080'

  # Applies catalog schema migrations and exits
  peerdb-flow-migrate:
    profiles: [cdc]
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.17
    entrypoint: ['/home/peerdb/peer-flow', 'migrate']
    environment:
      <<: *peerdb-catalog
    depends_on:
      peerdb-catalog:
        condition: service_healthy

  peerdb-flow-api:
    profiles: [cdc]
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.17
    restart: unless-stopped
    environment:
      <<: [*peerdb-catalog, *peerdb-temporal, *peerdb-staging]
      PEERDB_ALLOWED_TARGETS:
    depends_on:
      peerdb-flow-migrate:
        condition: service_completed_successfully
      peerdb-temporal-admin-tools:
        condition: service_healthy

  peerdb-flow-snapshot-worker:
    profiles: [cdc]
    image: ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.37.17
    restart: unless-stopped
    environment:
      <<: [*peerdb-catalog, *peerdb-temporal, *peerdb-staging]
    depends_on:
      peerdb-flow-migrate:
        condition: service_completed_successfully
      peerdb-temporal-admin-tools:
        condition: service_healthy

  peerdb-flow-worker:
    profiles: [cdc]
    image: ghcr.io/peerdb-io/flow-worker:stable-v0.37.17
    restart: unless-stopped
    environment:
      <<: [*peerdb-catalog, *peerdb-temporal, *peerdb-staging]
    depends_on:
      peerdb-flow-migrate:
        condition: service_completed_successfully
      peerdb-temporal-admin-tools:
        condition: service_healthy

  # Postgres-wire SQL interface: psql "host=localhost port=9900 password=peerdb"
  peerdb-server:
    profiles: [cdc]
    image: ghcr.io/peerdb-io/peerdb-server:stable-v0.37.17
    stop_signal: SIGINT
    restart: unless-stopped
    environment:
      <<: *peerdb-catalog
      PEERDB_PASSWORD: peerdb
      PEERDB_FLOW_SERVER_ADDRESS: grpc://peerdb-flow-api:8112
      PEERDB_MIGRATIONS_DISABLED: true
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - '${PEERDB_PORT:-9900}:9900'
    depends_on:
      peerdb-flow-migrate:
        condition: service_completed_successfully

  peerdb-ui:
    profiles: [cdc]
    image: ghcr.io/peerdb-io/peerdb-ui:stable-v0.37.17
    restart: unless-stopped
    environment:
      <<: *peerdb-catalog
      PEERDB_FLOW_SERVER_HTTP: http://peerdb-flow-api:8113
      NEXTAUTH_SECRET: __changeme__
      NEXTAUTH_URL: http://localhost:${PEERDB_UI_PORT:-3001}
      PEERDB_ALLOWED_TARGETS:
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS:
      PEERDB_EXPERIMENTAL_ENABLE_SCRIPTING: true
    ports:
      - '${PEERDB_UI_PORT:-3001}:3000'
    depends_on:
      - peerdb-flow-api

  peerdb-minio:
    profiles: [cdc]
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    environment:
      <<: *peerdb-staging
    volumes:
      - peerdb-minio-data:/data
    ports:
      - '${PEERDB_STAGING_CONSOLE_PORT:-9003}:36987'  # console
    entrypoint: >
      /bin/sh -c "
      silo server /data --console-address=:36987 &
      until mc alias set myminiopeerdb http://127.0.0.1:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing myminiopeerdb/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME;
      wait
      "

  # ---------------------------------------------------------------- Metabase (profile: bi)
  # Start it with: docker compose --profile bi up -d   ->  http://localhost:3002

  metabase:
    profiles: [bi]
    image: metabase/metabase:v0.65.6.3
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      JAVA_OPTS: -Xmx1g
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - '${METABASE_PORT:-3002}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail -s http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Metabase's own application database (dashboards, users, questions)
  metabase-db:
    profiles: [bi]
    image: postgres:18-alpine
    restart: unless-stopped
    labels:
      # Metabase's internal database, not a datasource for the app
      org.springframework.boot.ignore: 'true'
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metabase -d metabase']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data:
  peerdb-catalog-data:
  peerdb-minio-data:
  metabase-db-data:
